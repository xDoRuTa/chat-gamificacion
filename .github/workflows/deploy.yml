# CI/CD: en cada push a main se testea, se publica la imagen en GHCR y se
# despliega en el cluster del curso. Requiere el secret KUBECONFIG (contenido
# del archivo .kubeconfig personal) en Settings > Secrets and variables > Actions.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chat-gamificacion" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./gamification
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest

      - name: Tests de reglas
        run: docker run --rm ${{ steps.meta.outputs.image }}:${{ github.sha }} python -m unittest discover -s tests -v

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Fijar la imagen de este commit
        run: sed -i "s|ghcr.io/[^/]*/chat-gamificacion:[^ ]*|${{ needs.build.outputs.image }}:${{ github.sha }}|" k8s/*.yaml

      - name: Aplicar manifiestos
        run: kubectl apply -f k8s/

      - name: Esperar el rollout
        run: |
          kubectl rollout status statefulset/gamification-mongodb --timeout=180s
          kubectl rollout status deployment/gamification-api --timeout=180s
          kubectl rollout status deployment/gamification-poller --timeout=180s
