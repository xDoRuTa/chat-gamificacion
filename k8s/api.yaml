# API REST de gamificación: Deployment + Service + Ingress público + autoscaling.
# Cuota del grupo: limits.cpu 2. Con 4 réplicas: 4x200m + mongo 300m + poller 100m
# + Job de carga 300m = 1.5 CPU, con margen para un pod extra durante un rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gamification-api
  template:
    metadata:
      labels:
        app: gamification-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/xdoruta/chat-gamificacion:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MONGODB_URL
              value: mongodb://gamification-mongodb:27017
            - name: USERS_URL
              value: http://users.servicios-base.svc.cluster.local:8000
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Readiness: solo recibe tráfico si su base de datos responde.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          # Liveness: reinicia el contenedor si el proceso deja de responder.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-api
spec:
  selector:
    app: gamification-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamification-api
spec:
  ingressClassName: traefik
  rules:
    - host: gamificacion.134.199.176.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamification-api
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gamification-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gamification-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
