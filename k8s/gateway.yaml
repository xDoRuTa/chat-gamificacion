apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: grupo-gamificacion
data:
  USERS_URL: "http://user-service.servicios-base.svc.cluster.local:8000"
  CHANNELS_URL: "http://channel-service.servicios-base.svc.cluster.local:8000"
  MESSAGES_URL: "http://message-service.servicios-base.svc.cluster.local:8000"
  GAMIFICATION_URL: "http://gamification-api.grupo-gamificacion.svc.cluster.local:8000"
  REACTIONS_URL: "http://reaction-service.grupo-reacciones"
  MEDIA_URL: "http://media.grupo-archivos-adjuntos"
  PORT: "4000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamification-gateway
  namespace: grupo-gamificacion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gamification-gateway
  template:
    metadata:
      labels:
        app: gamification-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/xdoruta/chat-gamificacion-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gamification-gateway
  namespace: grupo-gamificacion
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: gamification-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: grupo-gamificacion
spec:
  ingressClassName: traefik
  rules:
    - host: chat-gamificacion.134.199.176.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamification-gateway
                port:
                  number: 4000
